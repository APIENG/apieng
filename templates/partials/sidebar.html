{{define "sidebar"}}
<style>
    .nav-link {
        display: flex; align-items: center;
        padding: 0.7rem 1rem; border-radius: 0.5rem;
        font-size: 0.875rem; font-weight: 500;
        color: #cbd5c0; border-left: 3px solid transparent;
        transition: all 0.2s ease;
    }
    .nav-link svg { width: 1.25rem; height: 1.25rem; margin-right: 0.75rem; flex-shrink: 0; }
    .nav-link:hover { background: rgba(255,255,255,0.06); color: #ffffff; }
    .nav-link.active {
        background: rgba(133,169,71,0.22);
        color: #ffffff;
        border-left-color: #85A947;
    }
    .sidebar-overlay { transition: opacity 0.2s ease; }
    @media (max-width: 1023px) {
        #appSidebar { position: fixed; inset: 0 auto 0 0; z-index: 50; transform: translateX(-100%); transition: transform 0.25s ease; }
        #appSidebar.open { transform: translateX(0); }
    }
</style>

<!-- Mobile top bar -->
<div class="lg:hidden fixed top-0 inset-x-0 z-40 flex items-center gap-3 px-4 h-14 shadow-sm" style="background-color: #123524;">
    <button id="sidebarToggle" class="p-1.5 rounded-md text-white" aria-label="Open menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <span class="text-lg font-bold tracking-wide" style="color: #EFE3C2;">APIENG</span>
</div>
<div id="sidebarOverlay" class="sidebar-overlay lg:hidden fixed inset-0 z-40 bg-black/40 opacity-0 pointer-events-none"></div>

<!-- Sidebar -->
<aside id="appSidebar" class="w-64 h-full flex flex-col shadow-lg" style="background-color: #123524; color: #E9EED9;">
    <!-- Logo -->
    <div class="px-6 py-6 flex items-center gap-2.5">
        <span class="flex items-center justify-center w-9 h-9 rounded-lg" style="background-color: #85A947;">
            <svg class="w-5 h-5" fill="none" stroke="#123524" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
        </span>
        <h1 class="text-xl font-bold tracking-wider">APIENG</h1>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-2 overflow-y-auto">
        <div class="mb-6">
            <p class="px-2 mb-2 text-xs font-semibold uppercase opacity-60">Main</p>
            <div class="space-y-1">
                <a href="/dashboard" class="nav-link {{if eq .Active "dashboard"}}active{{end}}">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    Dashboard
                </a>
                <a href="/metrics" class="nav-link {{if eq .Active "metrics"}}active{{end}}">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>
                    Metrics
                </a>
            </div>
        </div>
        <div class="mb-6">
            <p class="px-2 mb-2 text-xs font-semibold uppercase opacity-60">API Management</p>
            <div class="space-y-1">
                <a href="/endpoints" class="nav-link {{if eq .Active "endpoints"}}active{{end}}">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                    Endpoints
                </a>
                <a href="/keys" class="nav-link {{if eq .Active "keys"}}active{{end}}">
                    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
                    API Keys
                </a>
            </div>
        </div>
    </nav>

    <!-- User chip + bottom actions -->
    <div class="mt-auto border-t border-white/10 px-4 pt-4 pb-5">
        <div class="flex items-center gap-3 px-2 pb-3">
            <span class="flex items-center justify-center w-9 h-9 rounded-full text-sm font-semibold" style="background-color: #85A947; color: #123524;">{{if .UserInitial}}{{.UserInitial}}{{else}}U{{end}}</span>
            <div class="min-w-0">
                <p class="text-sm font-medium text-white truncate">{{if .UserEmail}}{{.UserEmail}}{{else}}Signed in{{end}}</p>
                <p class="text-xs opacity-60 truncate">Free plan</p>
            </div>
        </div>
        <a href="/settings" class="nav-link {{if eq .Active "settings"}}active{{end}}">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            Settings
        </a>
        <a href="/logout" class="nav-link mt-1">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
            Logout
        </a>
    </div>
</aside>

<script>
    (function () {
        var btn = document.getElementById('sidebarToggle');
        var bar = document.getElementById('appSidebar');
        var ov = document.getElementById('sidebarOverlay');
        function open() { bar.classList.add('open'); ov.classList.remove('opacity-0', 'pointer-events-none'); ov.classList.add('opacity-100'); }
        function close() { bar.classList.remove('open'); ov.classList.add('opacity-0', 'pointer-events-none'); ov.classList.remove('opacity-100'); }
        if (btn) btn.addEventListener('click', open);
        if (ov) ov.addEventListener('click', close);
    })();
</script>
{{end}}
