<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact · APIENG</title>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        :root {
            --forest-green: #123524;
            --medium-green: #3E7B27;
            --light-green: #85A947;
            --cream: #EFE3C2;
            --sage: #E9EED9;
        }
        * { font-family: 'Instrument Sans', sans-serif; }
        body { color: var(--forest-green); }
    </style>
</head>
<body class="bg-white">
    <!-- Top nav -->
    <header class="sticky top-0 z-40 border-b bg-white/90 backdrop-blur" style="border-color: var(--sage)">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-bold" style="color: var(--forest-green)">APIENG</a>
            <nav class="flex items-center gap-6 text-sm font-medium">
                <a href="/" class="hover:text-green-700">Home</a>
                <a href="/docs" class="hover:text-green-700">Docs</a>
                <a href="/contact" class="text-green-700">Contact</a>
                <a href="/login" class="px-4 py-2 rounded-md text-white" style="background-color: var(--medium-green)">Sign in</a>
            </nav>
        </div>
    </header>

    <div class="max-w-5xl mx-auto px-6 py-16 grid grid-cols-1 lg:grid-cols-2 gap-12">
        <!-- Intro -->
        <div>
            <h1 class="text-4xl font-bold mb-4">Get in touch</h1>
            <p class="text-lg leading-relaxed mb-8" style="color: var(--medium-green)">
                Questions about APIENG, enterprise deployments, or contributing to the open-source project?
                We'd love to hear from you.
            </p>

            <div class="space-y-5">
                <div class="flex items-start gap-3">
                    <span class="mt-1 text-green-700" aria-hidden="true">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 7.5A2.5 2.5 0 0 1 5.5 5h13A2.5 2.5 0 0 1 21 7.5v9A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5v-9Z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="m5.5 7 6.5 5 6.5-5"/>
                        </svg>
                    </span>
                    <div>
                        <p class="font-semibold">Email</p>
                        <a href="mailto:hello@apieng.dev" class="underline" style="color: var(--medium-green)">hello@apieng.dev</a>
                    </div>
                </div>
                <div class="flex items-start gap-3">
                    <span class="mt-1 text-green-700" aria-hidden="true">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7.5 8.5 12 6l4.5 2.5v5l-4.5 2.5L7.5 13.5v-5Z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7.5 8.5 12 11l4.5-2.5M12 11v6"/>
                        </svg>
                    </span>
                    <div>
                        <p class="font-semibold">Open Source</p>
                        <a href="https://github.com/APIENG/apieng" class="underline" style="color: var(--medium-green)">github.com/APIENG/apieng</a>
                    </div>
                </div>
                <div class="flex items-start gap-3">
                    <span class="mt-1 text-green-700" aria-hidden="true">
                        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 4.75A2.75 2.75 0 0 1 9.75 2h8.5A2.75 2.75 0 0 1 21 4.75v14.5A2.75 2.75 0 0 1 18.25 22h-8.5A2.75 2.75 0 0 1 7 19.25V4.75Z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 6.5H5.75A2.75 2.75 0 0 0 3 9.25v8A2.75 2.75 0 0 0 5.75 20H7"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M10 7.5h6M10 11h6M10 14.5h4"/>
                        </svg>
                    </span>
                    <div>
                        <p class="font-semibold">Documentation</p>
                        <a href="/docs" class="underline" style="color: var(--medium-green)">Read the docs</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- Form -->
        <div class="rounded-2xl border p-8" style="border-color: var(--sage); background-color: rgba(233,238,217,0.3)">
            <h2 class="text-xl font-semibold mb-6">Send us a message</h2>
            <form id="contactForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium mb-1" style="color: var(--medium-green)">Name</label>
                    <input id="name" type="text" required class="w-full px-4 py-3 rounded-lg border text-sm" style="border-color: var(--sage)">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1" style="color: var(--medium-green)">Email</label>
                    <input id="email" type="email" required class="w-full px-4 py-3 rounded-lg border text-sm" style="border-color: var(--sage)">
                </div>
                <div>
                    <label class="block text-xs font-medium mb-1" style="color: var(--medium-green)">Message</label>
                    <textarea id="message" rows="5" required class="w-full px-4 py-3 rounded-lg border text-sm" style="border-color: var(--sage)"></textarea>
                </div>
                <button type="submit" class="w-full py-3 rounded-lg font-semibold text-white" style="background-color: var(--medium-green)">Send Message</button>
            </form>
        </div>
    </div>

    <script>
        // No mail backend yet — compose via the user's mail client.
        document.getElementById('contactForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = encodeURIComponent(document.getElementById('name').value);
            const email = encodeURIComponent(document.getElementById('email').value);
            const message = encodeURIComponent(document.getElementById('message').value);
            const body = `Name: ${decodeURIComponent(name)}%0AEmail: ${decodeURIComponent(email)}%0A%0A${decodeURIComponent(message)}`;
            window.location.href = `mailto:hello@apieng.dev?subject=APIENG%20enquiry%20from%20${name}&body=${body}`;
        });
    </script>
</body>
</html>
